<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; color: #d4d4d4; }

.toolbar {
  display: flex; gap: 2px; padding: 6px 8px; background: #2d2d2d; border-bottom: 1px solid #3c3c3c; flex-wrap: wrap;
}
.toolbar button {
  background: transparent; border: 1px solid transparent; color: #d4d4d4; padding: 4px 8px; cursor: pointer; border-radius: 4px; font-size: 13px; min-width: 28px;
}
.toolbar button:hover { background: #3c3c3c; }
.toolbar .sep { width: 1px; background: #3c3c3c; margin: 0 4px; }

.editor-container { flex: 1; display: flex; overflow: hidden; }

#editor {
  flex: 1; padding: 16px; font-size: 15px; line-height: 1.8; outline: none;
  overflow-y: auto; white-space: pre-wrap; word-wrap: break-word;
  font-family: 'Consolas', 'Microsoft YaHei', monospace;
  color: #d4d4d4; background: #1e1e1e;
}
#editor:focus { background: #1e1e1e; }

#preview {
  flex: 1; padding: 16px; font-size: 15px; line-height: 1.8;
  overflow-y: auto; background: #252526; border-left: 1px solid #3c3c3c;
  display: none;
}
#preview h1 { font-size: 24px; margin: 16px 0 8px; color: #fff; }
#preview h2 { font-size: 20px; margin: 14px 0 6px; color: #fff; }
#preview h3 { font-size: 17px; margin: 12px 0 4px; color: #fff; }
#preview p { margin: 8px 0; }
#preview strong { color: #fff; }
#preview em { font-style: italic; }
#preview del { text-decoration: line-through; color: #888; }
#preview blockquote { border-left: 3px solid #569cd6; padding-left: 12px; color: #999; margin: 8px 0; }
#preview ul, #preview ol { padding-left: 24px; margin: 8px 0; }
#preview hr { border: none; border-top: 1px solid #3c3c3c; margin: 16px 0; }
#preview code { background: #2d2d2d; padding: 2px 6px; border-radius: 3px; font-family: Consolas, monospace; }
#preview pre { background: #2d2d2d; padding: 12px; border-radius: 4px; overflow-x: auto; margin: 8px 0; }
#preview pre code { background: transparent; padding: 0; }

.statusbar {
  display: flex; justify-content: space-between; padding: 4px 12px;
  background: #007acc; color: #fff; font-size: 12px;
}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="insertFormat('bold')" title="加粗"><b>B</b></button>
  <button onclick="insertFormat('italic')" title="斜体"><i>I</i></button>
  <button onclick="insertFormat('strikethrough')" title="删除线"><s>S</s></button>
  <div class="sep"></div>
  <button onclick="insertFormat('h1')" title="标题1">H1</button>
  <button onclick="insertFormat('h2')" title="标题2">H2</button>
  <button onclick="insertFormat('h3')" title="标题3">H3</button>
  <div class="sep"></div>
  <button onclick="insertFormat('quote')" title="引用">❝</button>
  <button onclick="insertFormat('ul')" title="无序列表">•</button>
  <button onclick="insertFormat('ol')" title="有序列表">1.</button>
  <div class="sep"></div>
  <button onclick="insertFormat('hr')" title="分隔线">—</button>
  <button onclick="insertFormat('code')" title="代码">&lt;/&gt;</button>
  <div class="sep"></div>
  <button onclick="togglePreview()" id="previewBtn" title="预览">预览</button>
</div>

<div class="editor-container">
  <div id="editor" contenteditable="true" spellcheck="false"></div>
  <div id="preview"></div>
</div>

<div class="statusbar">
  <span id="wordCount">字数: 0</span>
  <span id="saveStatus">已加载</span>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const wordCountEl = document.getElementById('wordCount');
const saveStatusEl = document.getElementById('saveStatus');
let previewVisible = false;

// Markdown to HTML conversion
function mdToHtml(md) {
  let html = md
    // Code blocks
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    // Headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // Bold, italic, strikethrough
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Blockquote
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // Horizontal rule
    .replace(/^---$/gm, '<hr>')
    // Unordered list
    .replace(/^[*-] (.+)$/gm, '<li>$1</li>')
    // Ordered list
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // Paragraphs
    .replace(/\n\n/g, '</p><p>')
    // Line breaks
    .replace(/\n/g, '<br>');

  // Wrap li in ul
  html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
  // Clean up nested ul
  html = html.replace(/<\/ul>\s*<ul>/g, '');

  return '<p>' + html + '</p>';
}

// HTML to Markdown conversion
function htmlToMd(html) {
  let md = html
    // Headers
    .replace(/<h1[^>]*>(.*?)<\/h1>/gi, '# $1\n\n')
    .replace(/<h2[^>]*>(.*?)<\/h2>/gi, '## $1\n\n')
    .replace(/<h3[^>]*>(.*?)<\/h3>/gi, '### $1\n\n')
    // Bold, italic, strikethrough
    .replace(/<strong><em>(.*?)<\/em><\/strong>/gi, '***$1***')
    .replace(/<strong>(.*?)<\/strong>/gi, '**$1**')
    .replace(/<em>(.*?)<\/em>/gi, '*$1*')
    .replace(/<del>(.*?)<\/del>/gi, '~~$1~~')
    // Code
    .replace(/<code>(.*?)<\/code>/gi, '`$1`')
    .replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/gi, '```\n$1\n```\n\n')
    // Blockquote
    .replace(/<blockquote>(.*?)<\/blockquote>/gi, '> $1\n')
    // Lists
    .replace(/<li>(.*?)<\/li>/gi, '- $1\n')
    .replace(/<\/?ul[^>]*>/gi, '\n')
    .replace(/<\/?ol[^>]*>/gi, '\n')
    // HR
    .replace(/<hr[^>]*>/gi, '\n---\n\n')
    // Paragraphs and line breaks
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p>\s*<p[^>]*>/gi, '\n\n')
    .replace(/<p[^>]*>/gi, '')
    .replace(/<\/p>/gi, '\n\n')
    // Strip remaining tags
    .replace(/<[^>]+>/g, '')
    // Decode entities
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    // Clean up whitespace
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  return md;
}

// Count words (CJK + English)
function countWords(text) {
  const clean = text.replace(/[#*\-~>`\[\]()]/g, '');
  let count = 0;
  let inWord = false;
  for (const c of clean) {
    if (c >= '一' && c <= '鿿') {
      count++;
      inWord = false;
    } else if (/\w/.test(c)) {
      if (!inWord) { count++; inWord = true; }
    } else {
      inWord = false;
    }
  }
  return count;
}

// Update word count
function updateWordCount() {
  const md = htmlToMd(editor.innerHTML);
  const count = countWords(md);
  wordCountEl.textContent = '字数: ' + count;
  window.chrome?.webview?.postMessage(JSON.stringify({ type: 'wordCount', count: count }));
}

// Update preview
function updatePreview() {
  if (!previewVisible) return;
  const md = htmlToMd(editor.innerHTML);
  preview.innerHTML = mdToHtml(md);
}

// Toggle preview
function togglePreview() {
  previewVisible = !previewVisible;
  preview.style.display = previewVisible ? 'block' : 'none';
  document.getElementById('previewBtn').style.background = previewVisible ? '#007acc' : 'transparent';
  updatePreview();
}

// Insert format
function insertFormat(type) {
  const sel = window.getSelection();
  const range = sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
  const selectedText = range ? range.toString() : '';

  let before = '', after = '', placeholder = '';
  switch (type) {
    case 'bold': before = '**'; after = '**'; placeholder = '粗体文字'; break;
    case 'italic': before = '*'; after = '*'; placeholder = '斜体文字'; break;
    case 'strikethrough': before = '~~'; after = '~~'; placeholder = '删除文字'; break;
    case 'h1': before = '# '; after = ''; placeholder = '标题'; break;
    case 'h2': before = '## '; after = ''; placeholder = '标题'; break;
    case 'h3': before = '### '; after = ''; placeholder = '标题'; break;
    case 'quote': before = '> '; after = ''; placeholder = '引用文字'; break;
    case 'ul': before = '- '; after = ''; placeholder = '列表项'; break;
    case 'ol': before = '1. '; after = ''; placeholder = '列表项'; break;
    case 'hr': before = '\n---\n'; after = ''; placeholder = ''; break;
    case 'code': before = '`'; after = '`'; placeholder = '代码'; break;
  }

  const text = selectedText || placeholder;
  const md = before + text + after;

  // Insert as text
  if (range) {
    range.deleteContents();
    const textNode = document.createTextNode(md);
    range.insertNode(textNode);
    range.selectNodeContents(textNode);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    editor.textContent += md;
  }

  editor.focus();
  onInput();
}

// Handle input
function onInput() {
  updateWordCount();
  updatePreview();
  saveStatusEl.textContent = '未保存';
  window.chrome?.webview?.postMessage(JSON.stringify({
    type: 'contentChanged',
    markdown: htmlToMd(editor.innerHTML)
  }));
}

editor.addEventListener('input', onInput);

// Load content from C#
function loadMarkdown(md) {
  editor.innerHTML = mdToHtml(md);
  updateWordCount();
  saveStatusEl.textContent = '已加载';
}

// Set save status
function setSaveStatus(status) {
  saveStatusEl.textContent = status;
}

// Handle keyboard shortcuts
editor.addEventListener('keydown', function(e) {
  if (e.ctrlKey || e.metaKey) {
    switch (e.key) {
      case 'b': e.preventDefault(); insertFormat('bold'); break;
      case 'i': e.preventDefault(); insertFormat('italic'); break;
    }
  }
});
</script>
</body>
</html>
